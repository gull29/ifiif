<script>
        (function () {
            function hasFullscreenElement(doc) {
                return Boolean(
                    doc.fullscreenElement ||
                    doc.webkitFullscreenElement ||
                    doc.mozFullScreenElement ||
                    doc.msFullscreenElement
                );
            }

            function isFrameFullscreenInTop() {
                try {
                    if (!window.top || !window.frameElement) return false;
                    const topDoc = window.top.document;
                    const fullscreenHost =
                        topDoc.fullscreenElement ||
                        topDoc.webkitFullscreenElement ||
                        topDoc.mozFullScreenElement ||
                        topDoc.msFullscreenElement;

                    if (!fullscreenHost) return false;

                    return (
                        fullscreenHost === window.frameElement ||
                        (typeof fullscreenHost.contains === "function" && fullscreenHost.contains(window.frameElement))
                    );
                } catch (_) {
                    return false;
                }
            }

            // The host page can force the bar on: iPhone Safari has no element
            // Fullscreen API, so /g/ pages there open us in a pseudo-fullscreen
            // and say so with ?fs=1, then toggle it over postMessage.
            let forcedFullscreen = /[?&]fs=1(?:&|$)/.test(window.location.search);

            function isGameFullscreen() {
                return forcedFullscreen || hasFullscreenElement(document) || isFrameFullscreenInTop();
            }

            // "Hide this bar" lasts for the current fullscreen stint only; the
            // bar comes back the next time fullscreen is entered.
            let barHidden = false;

            function syncFullscreenClass() {
                const fullscreen = isGameFullscreen();
                if (!fullscreen) barHidden = false;
                document.body.classList.toggle("is-game-fullscreen", fullscreen);
                document.body.classList.toggle("is-forced-fullscreen", forcedFullscreen);
                document.body.classList.toggle("is-bar-hidden", fullscreen && barHidden);
                try { window.dispatchEvent(new Event("resize")); } catch (_) {}
            }

            async function exitFullscreenAnyContext() {
                if (hasFullscreenElement(document)) {
                    if (document.exitFullscreen) return document.exitFullscreen();
                    if (document.webkitExitFullscreen) return document.webkitExitFullscreen();
                    if (document.mozCancelFullScreen) return document.mozCancelFullScreen();
                    if (document.msExitFullscreen) return document.msExitFullscreen();
                }

                try {
                    if (window.top && window.frameElement) {
                        const topDoc = window.top.document;
                        const fullscreenHost =
                            topDoc.fullscreenElement ||
                            topDoc.webkitFullscreenElement ||
                            topDoc.mozFullScreenElement ||
                            topDoc.msFullscreenElement;
                        const ownsFrame =
                            fullscreenHost &&
                            (fullscreenHost === window.frameElement ||
                                (typeof fullscreenHost.contains === "function" && fullscreenHost.contains(window.frameElement)));

                        if (ownsFrame && topDoc.exitFullscreen) {
                            return topDoc.exitFullscreen();
                        }
                        if (ownsFrame && topDoc.webkitExitFullscreen) {
                            return topDoc.webkitExitFullscreen();
                        }
                        if (ownsFrame && topDoc.mozCancelFullScreen) {
                            return topDoc.mozCancelFullScreen();
                        }
                        if (ownsFrame && topDoc.msExitFullscreen) {
                            return topDoc.msExitFullscreen();
                        }
                    }
                } catch (_) {}
            }

            async function minimizeGame() {
                try {
                    await exitFullscreenAnyContext();
                } catch (_) {}
                if (forcedFullscreen) {
                    forcedFullscreen = false;
                    try {
                        window.parent.postMessage({ type: "pe-exit-fullscreen" }, window.location.origin);
                    } catch (_) {}
                }
                syncFullscreenClass();
            }

            // The bottom bar's button and the landscape edge tab do the same job.
            ["minimize-btn", "landscape-minimize-btn"].forEach(function (id) {
                const btn = document.getElementById(id);
                if (btn) btn.addEventListener("click", minimizeGame);
            });

            const hideBarBtn = document.getElementById("hide-bar-btn");
            if (hideBarBtn) {
                hideBarBtn.addEventListener("click", function () {
                    if (forcedFullscreen) return;
                    barHidden = true;
                    syncFullscreenClass();
                });
            }

            window.addEventListener("message", function (event) {
                if (event.origin !== window.location.origin) return;
                if (!event.data || event.data.type !== "pe-force-fullscreen") return;
                forcedFullscreen = Boolean(event.data.value);
                syncFullscreenClass();
            });

            document.addEventListener("fullscreenchange", syncFullscreenClass);
            document.addEventListener("webkitfullscreenchange", syncFullscreenClass);
            document.addEventListener("mozfullscreenchange", syncFullscreenClass);
            document.addEventListener("MSFullscreenChange", syncFullscreenClass);

            try {
                if (window.top && window.top.document) {
                    window.top.document.addEventListener("fullscreenchange", syncFullscreenClass);
                    window.top.document.addEventListener("webkitfullscreenchange", syncFullscreenClass);
                    window.top.document.addEventListener("mozfullscreenchange", syncFullscreenClass);
                    window.top.document.addEventListener("MSFullscreenChange", syncFullscreenClass);
                }
            } catch (_) {}

            syncFullscreenClass();
        })();
</script>
  <script src="script.js"></script>
  <script>
    const appElement = document.getElementById('app');
    const launchScreen = document.getElementById('launch');
    const loadingScreen = document.getElementById('loading');
    const loadingInner = document.getElementById('loading-inner');
    const errorScreen = document.getElementById('error');
    const errorScreenMessage = document.getElementById('error-message');
    const errorScreenStack = document.getElementById('error-stack');

    const handleError = (error) => {
      console.error(error);
      if (!errorScreen.hidden) return;
      errorScreen.hidden = false;
      errorScreenMessage.textContent = '' + error;
      let debug = error && error.stack || 'no stack';
      debug += '\nUser agent: ' + navigator.userAgent;
      errorScreenStack.textContent = debug;
    };
    const setProgress = (progress) => {
      if (loadingInner) loadingInner.style.width = progress * 100 + '%';
    };
    const interpolate = (a, b, t) => a + t * (b - a);

    try {
      setProgress(0.1);

      const scaffolding = new Scaffolding.Scaffolding();
      scaffolding.width = 480;
      scaffolding.height = 360;
      scaffolding.resizeMode = "preserve-ratio";
      scaffolding.editableLists = false;
      scaffolding.usePackagedRuntime = true;
      scaffolding.setup();
      scaffolding.appendTo(appElement);

      const vm = scaffolding.vm;
      window.scaffolding = scaffolding;
      window.vm = scaffolding.vm;
      window.Scratch = {
        vm,
        renderer: vm.renderer,
        audioEngine: vm.runtime.audioEngine,
        bitmapAdapter: vm.runtime.v2BitmapAdapter,
        videoProvider: vm.runtime.ioDevices.video.provider
      };

      scaffolding.setUsername("player####".replace(/#/g, () => Math.floor(Math.random() * 10)));
      scaffolding.setAccentColor("#ff4c4c");

      try {
        scaffolding.addCloudProvider(new Scaffolding.Cloud.WebSocketProvider(["wss://clouddata.turbowarp.org","wss://clouddata.turbowarp.xyz"], "1270246440"));
      } catch (error) {
        console.error(error);
      }

      vm.setTurboMode(false);
      if (vm.setInterpolation) vm.setInterpolation(false);
      if (vm.setFramerate) vm.setFramerate(30);
      if (vm.renderer.setUseHighQualityRender) vm.renderer.setUseHighQualityRender(false);
      if (vm.setRuntimeOptions) vm.setRuntimeOptions({
        fencing: true,
        miscLimits: true,
        maxClones: 300,
      });
      if (vm.setCompilerOptions) vm.setCompilerOptions({
        enabled: true,
        warpTimer: false
      });
      if (vm.renderer.setMaxTextureDimension) vm.renderer.setMaxTextureDimension(2048);

      // enforcePrivacy threat model only makes sense in the editor
      if (vm.runtime.setEnforcePrivacy) vm.runtime.setEnforcePrivacy(false);

      if (typeof ScaffoldingAddons !== 'undefined') {
        ScaffoldingAddons.run(scaffolding, {"gamepad":false,"pointerlock":false,"specialCloudBehaviors":false,"unsafeCloudBehaviors":false,"pause":false});
      }

      scaffolding.setExtensionSecurityManager({
        getSandboxMode: () => 'unsandboxed',
        canLoadExtensionFromProject: () => true
      });
      for (const extension of []) {
        vm.extensionManager.loadExtensionURL(extension);
      }

    } catch (e) {
      handleError(e);
    }
  </script>
  
  
    <script>
      const getProjectData = (function() {
        const storage = scaffolding.storage;
        storage.onprogress = (total, loaded) => {
          setProgress(interpolate(0.2, 0.98, loaded / total));
        };
        
        storage.addWebStore(
          [
            storage.AssetType.ImageVector,
            storage.AssetType.ImageBitmap,
            storage.AssetType.Sound,
            storage.AssetType.Font
          ].filter(i => i),
          (asset) => new URL('./assets/' + asset.assetId + '.' + asset.dataFormat, location).href
        );
        return () => new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.onload = () => {
          resolve(xhr.response);
        };
        xhr.onerror = () => {
          if (location.protocol === 'file:') {
            reject(new Error('Zip environment must be used on a website, not on a local file. To fix this error, use the "Plain HTML" environment instead.'));
          } else {
            reject(new Error('Request to load project data failed.'));
          }
        };
        xhr.onprogress = (e) => {
          if (e.lengthComputable) {
            setProgress(interpolate(0.1, 0.2, e.loaded / e.total));
          }
        };
        xhr.responseType = 'arraybuffer';
        xhr.open('GET', "./assets/project.json");
        xhr.send();
      });
      })();
    </script>
  <script>
    const run = async () => {
      const projectData = await getProjectData();
      await scaffolding.loadProject(projectData);
      setProgress(1);
      loadingScreen.hidden = true;
      scaffolding.start();
    };
    run().catch(handleError);
  </script>
